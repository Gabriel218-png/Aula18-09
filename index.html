<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Empréstimo - Banco SENAI</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <script src="../JS/script.js"></script>
</head>

<body>

    <div class="container">

        <h2>Simulador de Empréstimo - Banco SENAI</h2>

        <label>Nome Completo (Min. 5 caracteres):</label>
        <input type="text" id="nome">

        <label>Data de Nascimento:</label>
        <input type="date" id="dataNascimento">

        <label>CPF (Apenas 11 números):</label>
        <input type="text" id="cpf" maxlength="11">

        <label>Valor do Empréstimo (R$):</label>
        <input type="number" id="valor" step="0.01">

        <label>Taxa de Juros Simples (%):</label>
        <input type="number" id="juros" step="0.01">

        <label>Quantidade de Parcelas:</label>
        <input type="number" id="parcelas">

        <button onclick="calcular()">Calcular Empréstimo</button>

        <div id="resultado"></div>

    </div>
</body>
</html>
